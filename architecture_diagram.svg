<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" width="1440" height="700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#bf4520"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ================= 1. BACKGROUND ZONES ================= -->
  
  <!-- Zone 1: Edge Sensing -->
  <rect x="40" y="80" width="220" height="580" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="56" y="68" width="160" height="22" rx="4" fill="#f1f5f9"/>
  <text x="136" y="83" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.08em">EDGE SENSING LAYER</text>

  <!-- Zone 2: Gateway & Processing (Raspberry Pi 5) -->
  <rect x="320" y="80" width="380" height="580" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="336" y="68" width="240" height="22" rx="4" fill="#e2e8f0"/>
  <text x="456" y="83" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="0.08em">SMART HUB (RASPBERRY PI 5)</text>

  <!-- Zone 3: Edge Routing & Security (Cloudflare) -->
  <rect x="840" y="80" width="250" height="580" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="856" y="68" width="200" height="22" rx="4" fill="#f1f5f9"/>
  <text x="956" y="83" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.08em">CLOUDFLARE EDGE NETWORK</text>

  <!-- Zone 4: Client & Presentation -->
  <rect x="1180" y="80" width="220" height="580" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="1196" y="68" width="160" height="22" rx="4" fill="#f1f5f9"/>
  <text x="1276" y="83" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.08em">CLIENT ACCESS LAYER</text>


  <!-- ================= 2. CONNECTORS / ARROWS (Wide open lanes, zero overlap) ================= -->
  
  <!-- Connector 1: ESP32-H2 -> BLE Adapter -->
  <path d="M 240,215 H 338" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow-blue)"/>
  
  <!-- Connector 2: BLE Adapter -> HA Core -->
  <path d="M 510,255 V 293" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  
  <!-- Connector 3: HA Core -> Dashboard -->
  <path d="M 510,410 V 443" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

  <!-- Connector 4: HA Core -> Cloudflared -->
  <path d="M 400,410 V 553" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Connector 5: Cloudflared (Pi 5) -> Cloudflare Edge (QUIC Tunnel) -->
  <!-- Leaves Pi5 Node at x=680, y=600. Runs in open 140px corridor at x=770, turns right into Node 3B at (858, 430) -->
  <path d="M 680,600 H 762 Q 770,600 770,592 V 438 Q 770,430 778,430 H 858" 
        fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Connector 6: Anycast -> Mobile Client -->
  <path d="M 1070,235 H 1198" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Connector 7: Edge Security -> Web Browsers -->
  <path d="M 1070,430 H 1198" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>


  <!-- ================= 3. CONNECTOR LABELS (Spacious open clearance) ================= -->
  
  <!-- Label 1: BLE Broadcast -->
  <rect x="257" y="204" width="64" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="289" y="219" font-size="9" font-family="monospace" font-weight="600" fill="#2563eb" text-anchor="middle">BLE 5.3</text>

  <!-- Label 2: QUIC Tunnel (Centered in the 140px open channel at x=770, y=515) -->
  <rect x="724" y="504" width="92" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="770" y="519" font-size="10" font-family="monospace" font-weight="700" fill="#2563eb" text-anchor="middle">QUIC Tunnel</text>

  <!-- Label 3 & 4: HTTPS & WSS -->
  <rect x="1108" y="224" width="54" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="1135" y="239" font-size="9.5" font-family="monospace" font-weight="600" fill="#475569" text-anchor="middle">HTTPS</text>

  <rect x="1102" y="419" width="66" height="22" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="1.2"/>
  <text x="1135" y="434" font-size="9.5" font-family="monospace" font-weight="700" fill="#bf4520" text-anchor="middle">WSS Live</text>


  <!-- ================= 4. COMPONENT NODES (Opaque white backgrounds) ================= -->

  <!-- Node 1: ESP32-H2 Sensor -->
  <rect x="60" y="140" width="180" height="160" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <text x="80" y="170" font-size="14" font-weight="700" fill="#0f172a">ESP32-H2 Node</text>
  <text x="80" y="188" font-size="11" font-weight="600" fill="#bf4520">Tag ID: 32A2</text>
  <line x1="60" y1="200" x2="240" y2="200" stroke="#f1f5f9" stroke-width="1"/>
  <text x="80" y="222" font-size="11" fill="#475569">• RISC-V 32-bit MCU</text>
  <text x="80" y="240" font-size="11" fill="#475569">• BLE 5.3 + 802.15.4</text>
  <text x="80" y="258" font-size="11" fill="#475569">• BTHome v2 (0xFCD2)</text>
  <text x="80" y="276" font-size="11" fill="#475569">• 10s Broadcast Cadence</text>

  <!-- Node 1b: Telemetry Payload Specs -->
  <rect x="60" y="325" width="180" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="350" font-size="12" font-weight="600" fill="#334155">Telemetry Payload</text>
  <text x="80" y="373" font-size="11" fill="#64748b">• Temp (°C): ±0.1 Res</text>
  <text x="80" y="391" font-size="11" fill="#64748b">• Humidity (%): ±0.5 Res</text>
  <text x="80" y="409" font-size="11" fill="#64748b">• Non-connectable Adv</text>

  <!-- Node 2A: BLE Interface -->
  <rect x="340" y="170" width="340" height="85" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <text x="360" y="200" font-size="13" font-weight="700" fill="#0f172a">BlueZ HCI &amp; BTHome Integration</text>
  <text x="360" y="220" font-size="11" fill="#64748b">Linux Bluetooth stack captures BTHome v2 beacon</text>
  <text x="360" y="238" font-size="10" font-family="monospace" fill="#2563eb">Parsing: UUID 0xFCD2 → Sensor Mapping</text>

  <!-- Node 2B: Home Assistant Core (FOCAL / ACCENT ELEMENT) -->
  <rect x="340" y="295" width="340" height="115" rx="8" fill="#fffbf9" stroke="#bf4520" stroke-width="2"/>
  <text x="360" y="323" font-size="14" font-weight="700" fill="#bf4520">Home Assistant Core Engine</text>
  <text x="360" y="343" font-size="11" font-weight="600" fill="#0f172a">State Machine &amp; SQLite Event Recorder</text>
  <line x1="340" y1="353" x2="680" y2="353" stroke="rgba(191, 69, 32, 0.15)" stroke-width="1"/>
  <text x="360" y="372" font-size="10" font-family="monospace" fill="#0f172a">• sensor.living_room_h2_sim_32a2_temperature</text>
  <text x="360" y="390" font-size="10" font-family="monospace" fill="#0f172a">• sensor.living_room_h2_sim_32a2_humidity</text>

  <!-- Node 2C: Lovelace UI Dashboard -->
  <rect x="340" y="445" width="340" height="80" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <text x="360" y="471" font-size="13" font-weight="700" fill="#0f172a">ESP32-H2 Lab Dashboard</text>
  <text x="360" y="490" font-size="11" fill="#64748b">Custom Lovelace Card Stack (/esp32-h2-lab/0)</text>
  <text x="360" y="508" font-size="11" fill="#475569">• Dual Gauges • Mini Trend Tiles • 1h History Line Chart</text>

  <!-- Node 2D: Cloudflared Standalone Tunnel (Native Pi 5) -->
  <rect x="340" y="555" width="340" height="85" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <text x="360" y="581" font-size="13" font-weight="700" fill="#0f172a">Cloudflared Standalone Service (Pi 5 Native)</text>
  <text x="360" y="600" font-size="11" fill="#64748b">Reverse Proxy Config: Trust X-Forwarded-For: Yes</text>
  <text x="360" y="618" font-size="11" fill="#2563eb">• Outbound QUIC/UDP 7844 (Zero Port Forwarding • 24/7)</text>

  <!-- Node 3A: Cloudflare Edge Anycast -->
  <rect x="860" y="160" width="210" height="150" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <text x="880" y="190" font-size="13" font-weight="700" fill="#0f172a">Cloudflare Anycast</text>
  <text x="880" y="208" font-size="11" font-weight="600" fill="#2563eb">Global Edge PoPs</text>
  <line x1="860" y1="218" x2="1070" y2="218" stroke="#f1f5f9" stroke-width="1"/>
  <text x="880" y="238" font-size="11" fill="#475569">• Bangkok (bkk07/09)</text>
  <text x="880" y="256" font-size="11" fill="#475569">• Singapore (sin02/13)</text>
  <text x="880" y="274" font-size="11" fill="#475569">• Zero Trust Argo Tunnel</text>
  <text x="880" y="292" font-size="11" fill="#475569">• Automatic Failover</text>

  <!-- Node 3B: Edge Security & Ingress -->
  <rect x="860" y="350" width="210" height="160" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <text x="880" y="380" font-size="13" font-weight="700" fill="#0f172a">Edge Security &amp; SSL</text>
  <text x="880" y="398" font-size="11" fill="#64748b">Public Ingress Router</text>
  <line x1="860" y1="218" x2="1070" y2="218" stroke="#f1f5f9" stroke-width="1"/>
  <text x="880" y="428" font-size="11" fill="#475569">• TLS 1.3 Encryption</text>
  <text x="880" y="446" font-size="11" fill="#475569">• WebSocket / RFC 8441</text>
  <text x="880" y="464" font-size="11" fill="#475569">• DDoS &amp; Bot Shield</text>
  <text x="880" y="482" font-size="11" fill="#475569">• Public HTTPS Proxy</text>

  <!-- Node 4A: Mobile Client -->
  <rect x="1200" y="175" width="180" height="120" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <text x="1220" y="205" font-size="13" font-weight="700" fill="#0f172a">Mobile Devices</text>
  <text x="1220" y="223" font-size="11" fill="#64748b">Cellular / Remote</text>
  <line x1="1200" y1="233" x2="1380" y2="233" stroke="#f1f5f9" stroke-width="1"/>
  <text x="1220" y="253" font-size="11" fill="#475569">• iOS / Android</text>
  <text x="1220" y="271" font-size="11" fill="#475569">• HA Mobile Companion</text>

  <!-- Node 4B: Desktop Client -->
  <rect x="1200" y="370" width="180" height="120" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <text x="1220" y="400" font-size="13" font-weight="700" fill="#0f172a">Web Browsers</text>
  <text x="1220" y="418" font-size="11" fill="#64748b">Desktop / Tablet</text>
  <line x1="1200" y1="428" x2="1380" y2="428" stroke="#f1f5f9" stroke-width="1"/>
  <text x="1220" y="448" font-size="11" fill="#475569">• Chrome / Safari / Edge</text>
  <text x="1220" y="466" font-size="11" fill="#475569">• Live WSS Telemetry</text>
  <text x="1220" y="484" font-size="11" fill="#475569">• Full Dashboard View</text>

</svg>
